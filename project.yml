name: NewWindowPlz
options:
  bundleIdPrefix: com.peter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO

targets:
  NewWindowPlz:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/OverlayShaders.metal.txt
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: New Window Plz
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.2.2"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Peter. All rights reserved."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.newwindowplz
        PRODUCT_NAME: NewWindowPlz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_TESTABILITY: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - NewWindowPlzTests

  NewWindowPlzTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: NewWindowPlz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.newwindowplz.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NewWindowPlz.app/Contents/MacOS/NewWindowPlz"
